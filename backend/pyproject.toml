[project]
name = "codex-hackathon-backend"
version = "0.1.0"
description = "Lightweight monolithic API for the Codex Hackathon demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "mangum>=0.21,<1.0",
    "openai>=3.1,<4.0",
    "psycopg[binary]>=3.3,<4.0",
    "python-multipart>=0.0.32,<1.0",
    "sqlalchemy>=2.0.52,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
